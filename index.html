<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Candles</title>
  <link rel="stylesheet" href="style.css?v=20260804b">
</head>

<body>
  <!-- Centered Pixel Art Canvas Stage -->
  <div class="pixel-stage">
    <canvas id="pixel-cake-canvas" width="128" height="128"></canvas>
  </div>

  <!-- Background Music Audio Element -->
  <audio id="bg-music" src="music.mp3" loop></audio>

  <!-- Canvas Overlay for Pixel Confetti / Sparks -->
  <canvas id="sparkles-canvas"></canvas>

  <!-- Countdown Lock Overlay (Disabled) -->
  <div id="lock-overlay" class="lock-overlay hidden">
    <div id="countdown-text" class="countdown-text"></div>
  </div>

  <!-- Candle Gate Overlay -->
  <div id="candle-gate" class="candle-gate hidden">
    <div id="candle-targets" class="candle-targets"></div>
  </div>

  <!-- Message Phase Overlay -->
  <div id="message-gate" class="message-gate hidden">
    <div class="message-gate-inner">
      <p id="message-gate-text" class="message-gate-text">Everyone has a direction in life; some follow it and find joy,
        while others do not. But the most important thing is to believe in your heart. Trusting the direction you are
        heading as you walk forward is what makes your soul truly beautiful.
      </p>
      <p id="message-gate-text" class="message-gate-text">happy birthday, el.</p>
      <button id="message-proceed-btn" class="message-proceed-btn">proceed now to blow the candles</button>
      <p id="message-second-line" class="message-second-line hidden"></p>
    </div>
  </div>

  <script src="script.js?v=20260804b" defer></script>
</body>

</html>
